- name: '> ThreatConnect > STIX Fetch and Create'
  uuid: b25c605f-d530-5c38-a566-ae6d5d445b34
  description: Fetch indicators from ThreatConnect's TAXII 2.1 (STIX) server and create them as threat
    intel feeds. Called as a child workflow.
  tags:
  - dataingestion
  - fetch
  - create
  - threatconnect
  - stix
  is_active: true
  trigger_step_id: start
  parameters:
  - lastPullTime
  steps:
  - type: start
    name: Start
    configuration_schema:
    - title: Indicator Type Filter
      name: indicator_type
      type: select
      required: false
      editable: true
      visible: true
      options:
      - Any
      - Address
      - Host
      - URL
      - EmailAddress
      - File
      value: Any
      tooltip: Restrict ingestion to a single ThreatConnect indicator type. 'Any' pulls all types.
    - title: Collection Filter (Optional)
      name: owner
      type: text
      required: false
      editable: true
      visible: true
      tooltip: 'Restrict ingestion to one TAXII collection: an owner (Source/Community/Organization) name
        or a collection id. Defaults to the connector''s Default Organization, and without one every readable
        collection is pulled.'
    - title: Ingestion Begin From
      name: last_pull_datetime
      type: datetime
      required: false
      editable: true
      visible: true
      tooltip: Pull only indicators modified at or after this datetime. Updated automatically by the scheduler
        after each run.
    - title: Reputation
      name: reputation
      type: select
      required: true
      editable: true
      visible: true
      options:
      - Good
      - Suspicious
      - Malicious
      - No Reputation Available
      - TBD
      value: Suspicious
      tooltip: Default reputation applied to ingested indicators.
    - title: TLP
      name: tlp
      type: select
      required: false
      editable: true
      visible: true
      options:
      - Red
      - Amber
      - Green
      - White
      value: Amber
      tooltip: Applied when a STIX indicator carries no TLP marking; a marking on the indicator wins.
    - title: Confidence
      name: confidence
      type: integer
      required: false
      editable: true
      visible: true
      value: 75
      validation:
        minlength: 0
        maxlength: 100
      tooltip: Default confidence applied when an indicator does not carry one.
    - title: Maximum Age (in days)
      name: expiry
      type: integer
      required: false
      editable: true
      visible: true
      value: 30
    - title: Per-Run Limit (Optional)
      name: limit
      type: integer
      required: false
      editable: true
      visible: true
      tooltip: Cap indicators ingested per run. Leave blank for full pagination.
    next: configuration
  - type: set_variable
    name: Configuration
    vars:
      indicator_type: Any
      owner: ''
      last_pull_datetime: 0
      reputation: Suspicious
      tlp: Amber
      confidence: 75
      expiry: 30
      limit: 0
      tlp_map: '{''Red'': {{''TrafficLightProtocol'' | picklist(''Red'') }}, ''Amber'': {{''TrafficLightProtocol''
        | picklist(''Amber'') }}, ''Green'': {{''TrafficLightProtocol'' | picklist(''Green'') }}, ''White'':
        {{''TrafficLightProtocol'' | picklist(''White'') }}}'
      reputation_map: '{''Good'': {{''IndicatorReputation'' | picklist(''Good'') }}, ''Malicious'': {{''IndicatorReputation''
        | picklist(''Malicious'') }}, ''Suspicious'': {{''IndicatorReputation'' | picklist(''Suspicious'')
        }}, ''TBD'': {{''IndicatorReputation'' | picklist(''TBD'') }}, ''No Reputation Available'': {{''IndicatorReputation''
        | picklist(''No Reputation Available'') }}}'
      type_of_feed_map: '{''Address'': {{''ThreatIntelFeedType'' | picklist(''IPv4 Address'') }}, ''Host'':
        {{''ThreatIntelFeedType'' | picklist(''Domain'') }}, ''EmailAddress'': {{''ThreatIntelFeedType''
        | picklist(''Email Address'') }}, ''URL'': {{''ThreatIntelFeedType'' | picklist(''URL'') }}, ''File'':
        {{''ThreatIntelFeedType'' | picklist(''FileHash-SHA256'') }}, ''FileMD5'': {{''ThreatIntelFeedType''
        | picklist(''FileHash-MD5'') }}, ''FileSHA1'': {{''ThreatIntelFeedType'' | picklist(''FileHash-SHA1'')
        }}}'
    next: is_data_only_for_mapping
  - type: decision
    name: Is Data Only For Mapping
    conditions:
    - display: Yes For Mapping
      when: '{{ vars.request.env_setup == true }}'
      next: return_sample_data
    - display: No For Ingestion
      default: true
      next: fetch_stix_indicators
  - type: set_variable
    name: Return Sample Data
    vars:
      data: "[\n  {\n    \"value\": \"192.0.2.1\",\n    \"type\": \"ip\",\n    \"score\": 80,\n    \"\
        risk_string\": \"sample\"\n  },\n  {\n    \"value\": \"203.0.113.5\",\n    \"type\": \"ip\",\n\
        \    \"score\": 65,\n    \"risk_string\": \"sample\"\n  }\n]"
  - type: connector
    name: Fetch STIX Indicators
    pickFromTenant: false
    config: ''
    params:
      indicator_type: '{{vars.indicator_type}}'
      owner: '{{vars.owner}}'
      modified_since: '{{vars.input.params.lastPullTime}}'
      page_size: 500
      limit: '{{vars.limit}}'
    connector: threatconnect
    operation: fetch_stix_indicators
    next: build_feed_list
  - type: set_variable
    name: Build Feed List
    vars:
      data: '{{vars.steps.Fetch_STIX_Indicators.indicators}}'
      currentPullTime: '{{ arrow.utcnow().isoformat() }}'
    next: create_record
  - type: ingest_bulk_feed
    name: Create Record
    when: '{{vars.data | length > 0}}'
    resource:
      value: '{% if vars.item.type == ''File'' %}{{ vars.item.summary.split('' : '')|last }}{% else %}{{
        vars.item.summary }}{% endif %}'
      typeOfFeed: '{{ ((''FileMD5'' if (vars.item.summary.split('' : '')|last|length) == 32 else ''FileSHA1''
        if (vars.item.summary.split('' : '')|last|length) == 40 else ''File'') if vars.item.type == ''File''
        else vars.item.type) | resolveRange(vars.type_of_feed_map) }}'
      source: ThreatConnect
      sourceId: '{{vars.item.id}}'
      tLP: '{% if (vars.item.tlp or vars.tlp) %}{{ (vars.item.tlp or vars.tlp) | resolveRange(vars.tlp_map)
        }}{% else %}None{% endif %}'
      reputation: '{% if vars.reputation %}{{ vars.reputation | resolveRange(vars.reputation_map) }}{%
        else %}None{% endif %}'
      confidence: '{% if vars.item.confidence %}{{ vars.item.confidence }}{% else %}{{ (vars.confidence
        | int) }}{% endif %}'
      expiresOn: '{% if vars.expiry %}{{ arrow.utcnow().int_timestamp + (vars.expiry | int)*24*60*60 }}{%
        else %}None{% endif %}'
      sourceData: '{{vars.item | toJSON}}'
      description: '{% if vars.item.description %}ThreatConnect: {{vars.item.description}}{% else %}ThreatConnect
        indicator{% endif %}'
      __replace: ''
    collection: /api/ingest-feeds/threat_intel_feeds
    for_each:
      item: '{{vars.data}}'
      __bulk: true
      condition: ''
      batch_size: 100
    next: save_result
  - type: set_variable
    name: Save Result
    vars:
      currentPullTime: '{{vars.currentPullTime}}'
- name: ThreatConnect > STIX Ingest
  uuid: 3f4ce155-2ee7-5936-a850-a25d1d2ef478
  description: Scheduled ingestion orchestrator for ThreatConnect's TAXII 2.1 (STIX) server. Maintains
    its own per-install LastPullTime macro.
  tags:
  - dataingestion
  - ingest
  - threatconnect
  - stix
  is_active: true
  trigger_step_id: start
  steps:
  - type: start
    name: Start
    next: configuration
  - type: set_variable
    name: Configuration
    vars:
      fetchTime: '0'
      pullTimeMacro: ThreatconnectLastPullTime_{{vars['audit_info']['cyops_playbook_iri'].split('/')[-1].replace('-','_')}}
    next: get_macro_value
  - type: connector
    name: Get Macro Value
    params:
      iri: /api/wf/api/dynamic-variable/?name={{vars.pullTimeMacro}}
      body: ''
      method: GET
    connector: cyops_utilities
    operation: make_cyops_request
    next: extract_value_from_response
  - type: set_variable
    name: Extract Value from Response
    vars:
      lastPullTime: '{% if (vars.steps.Get_Macro_Value.data[''hydra:member''] | length) > 0 %}{{ vars.steps.Get_Macro_Value.data[''hydra:member''][0].value
        }}{% else %}0{% endif %}'
    next: fetch_stix_indicators
  - type: workflow_reference
    name: Fetch STIX Indicators
    apply_async: false
    child_args:
      lastPullTime: '{{vars.lastPullTime}}'
    workflowReference: /api/3/workflows/b25c605f-d530-5c38-a566-ae6d5d445b34
    next: update_pull_time
  - type: connector
    name: Update Pull Time
    params:
      macro: '{{vars.pullTimeMacro}}'
      value: '{{vars.steps.Fetch_STIX_Indicators.currentPullTime}}'
    connector: cyops_utilities
    operation: updatemacro
    operationTitle: 'CyOPs: Update Macro'
