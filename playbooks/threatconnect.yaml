# ThreatConnect sample playbook collection.
#
# Compiled to threatconnect/playbooks/playbooks.json by scripts/build_playbooks.sh
# (the fsrpb compiler, set FSRPB_HOME). Author here, never in the JSON.
#
#   * Lookups and changes (inactive samples): clone one, fill in the example values.
#   * Get STIX Indicators, ThreatConnect > STIX Fetch and Create, ThreatConnect > STIX Ingest
#     (active): the data ingestion contract, over ThreatConnect's TAXII 2.1 (STIX) server.
#     STIX Ingest reads a last-pull-time macro, calls STIX Fetch and Create, and moves the
#     macro forward. File indicators land as MD5, SHA1 or SHA256 by hash length. They need
#     the TAXII user in the connector configuration.

collection: Sample - ThreatConnect - 2.3.0
uuid: 9faafbb0-2fee-5100-ac77-3b72ca28a108
description: 'Sample playbooks for ThreatConnect: indicator lookups and changes, and scheduled STIX ingestion.
